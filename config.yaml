# Paths and parameters for the credit default pipeline. Paths are relative to the repo root.
data:
  url: https://archive.ics.uci.edu/static/public/350/default+of+credit+card+clients.zip
  zip: data/default_of_credit_card_clients.zip
  xls_name: default of credit card clients.xls
  raw: data/raw.parquet
  table: data/features.parquet
  min_zip_bytes: 1000000

paths:
  results: results
  docs: docs

cleaning:
  # EDUCATION is documented as 1-4; 0, 5 and 6 appear in the file and are folded into 4 ("other").
  education_other: [0, 5, 6]
  # MARRIAGE is documented as 1-3; 0 appears and is folded into 3 ("other").
  marriage_other: [0]

features:
  # Protected attributes kept out of every model; SEX is still used for the fairness check.
  excluded: [sex, marriage]
  utilisation_cap: 3.0
  payment_ratio_cap: 2.0
  age_bands: [20, 30, 40, 50, 80]
  limit_bands: [0, 50000, 140000, 240000, 1000000]

validation:
  seed: 42
  folds: 5

models:
  woe:
    max_bins: 6
    min_bin_share: 0.05
    min_iv: 0.02
    C: 1.0
  logistic:
    C: 0.5
  xgboost:
    n_estimators: 400
    learning_rate: 0.03
    max_depth: 4
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_weight: 5
  tuning:
    n_iter: 8
    folds: 3
  calibration_folds: 3

scorecard:
  base_score: 600     # score at the base odds
  base_odds: 50       # good:bad odds that map to the base score
  pdo: 20             # points that double the odds

evaluation:
  n_boot: 1000
  calibration_bins: 10

decision:
  # Per-account economics of keeping a line open for the next cycle, as shares of the current balance.
  lgd: 0.60                # loss given default
  margin: 0.08             # net revenue earned on a good account's balance over the horizon
  lgd_sensitivity: [0.40, 0.60, 0.80]
  threshold_grid: [0.02, 0.90, 0.01]   # start, stop, step for the threshold sweep
  min_exposure: 1000       # floor on exposure (NT$) so zero-balance accounts still carry some risk
